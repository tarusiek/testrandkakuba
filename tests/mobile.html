<!doctype html>
<html lang="pl">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Podgląd responsywny</title>
<style>body{font:14px system-ui;margin:0;padding:16px;background:#e5e5e5}iframe{display:block;width:390px;height:844px;border:0;background:white}header{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px}select,button{font:inherit;padding:6px}output{display:block;margin:12px 0}</style>
<header><label>Szerokość <select id="width"><option>320</option><option>360</option><option selected>390</option><option>768</option><option>1366</option></select> px</label><label>Strona <select id="page"><option value="../index.html">Zaproszenie</option><option value="../sites/kalendarz.html">Kalendarz</option><option value="../sites/wybor_jedzenia.html">Plan</option><option value="../sites/koncowka.html">Podsumowanie</option></select></label></header>
<output id="metrics" aria-live="polite"></output><iframe title="Podgląd strony" src="../index.html"></iframe>
<script>
const frame = document.querySelector('iframe');
function measure() {
  const d = frame.contentDocument;
  if (!d?.body) return;
  document.getElementById('metrics').textContent = `Szerokość widoku: ${d.documentElement.clientWidth} px; treści: ${d.documentElement.scrollWidth} px. ${d.documentElement.scrollWidth <= d.documentElement.clientWidth ? 'Brak poziomego przewijania.' : 'Treść wychodzi poza ekran.'}`;
}
document.getElementById('width').addEventListener('change', event => {frame.style.width = `${event.target.value}px`; requestAnimationFrame(measure);});
document.getElementById('page').addEventListener('change', event => {frame.src = event.target.value;});
frame.addEventListener('load', () => {measure();frame.contentDocument.fonts.ready.then(measure);});
</script></html>
